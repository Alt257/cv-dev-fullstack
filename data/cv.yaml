    Titulaire du titre professionnel **CDA**, j’ai développé une
    **polyvalence fullstack** appliquée sur des projets concrets
    (**Symfony**, **Flutter**, **Angular**). Mes expériences 
    m’ont permis de contribuer à l’architecture, 
    au développement et à l’amélioration continue 
    d’applications **web et mobiles**, en équipe comme 
    en autonomie. Sensibilisé aux bonnes pratiques 
    (**TDD**, **SOLID**) et en progression sur la **CI/CD**,
    je m’intègre rapidement dans un environnement Agile.

