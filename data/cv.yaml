profile:
  quote: "Il y a un point commun entre un escape game bien conçu et un logiciel réussi : tout doit s'assembler avec élégance."
  content: >
    Titulaire du titre professionnel français Concepteur
    Développeur d’Applications (CDA), je maîtrise l’ensemble
    du cycle de développement — de l’analyse des besoins à 
    la mise en production. Cette formation reconnue pour son 
    exigence technique développe une forte polyvalence 
    fullstack, une rigueur en architecture logicielle, 
    ainsi qu’une capacité à concevoir des applications 
    robustes, sécurisées et évolutives. Habitué aux 
    bonnes pratiques modernes (TDD, SOLID, design patterns),
    je suis opérationnel rapidement et capable de contribuer
    efficacement à des projets web et mobiles dans un
    environnement Agile.

