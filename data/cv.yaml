      - **Développement Fullstack architecture native :** Programmation de nouvelles fonctionnalités métiers et optimisation des interfaces utilisateurs en utilisant PHP et JavaScript natif (sans framework).
      - **Maintenance et évolution :** Analyse du code existant, résolution de bogues complexes et amélioration continue de la structure de la base de données relationnelle.
