    company: "La Bonne Idée"
    company_href: "https://la-bonne-idee.com"
    location: "France"
    note: |
      *Développement d'applications web et mobiles sur mesure.*
      - Stack principale : Symfony (API REST), Flutter et Angular
      - Mise en place de pipelines CI/CD, déploiement Docker, gestion Linux/SSH
      - Application systématique du TDD et des principes SOLID
      - Collaboration directe avec les clients pour la conception fonctionnelle et UX


