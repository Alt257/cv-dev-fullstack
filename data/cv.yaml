    company: "Epic Gear Factory"
    company_href: "https://annuaire-entreprises.data.gouv.fr/entreprise/epic-gear-832998652"
    location: "Amance, France"
    note: |
      Conception et fabrication de décors pour jeux d'évasion & projets créatifs collaboratifs.
      - **Direction de produit de A à Z :** Conception et réalisation autonome de l'intégralité de jeux d'évasion (escape games), incluant la narration, le design de l'expérience et la construction.
      - **Ingénierie logique et interactivité :** Modélisation et codage (langage **C**) des algorithmes régissant les énigmes, les capteurs et les mécanismes interactifs des salles.
      - **Design UX et scénarisation :** Création du parcours utilisateur, de la structure dramatique et de l'ambiance artistique pour garantir une immersion et une fluidité de jeu maximales.
      - **Gestion de projet autonome :** Prise en charge globale des contraintes techniques, budgétaires et logistiques, démontrant une forte habileté en résolution de problèmes complexes.
      - **Compétences transversales éprouvées :** Forte autonomie, débrouillardise technique et capacité éprouvée à concevoir des architectures logiques basées sur l'expérience utilisateur (UX).

